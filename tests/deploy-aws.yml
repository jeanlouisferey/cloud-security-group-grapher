---
# Déploie une infrastructure 3-tiers sur AWS pour tester cloud-securitygroup-grapher
# Architecture : 1 LB → 2 Web Servers → 1 Database
#
# Usage : ansible-playbook playbooks/deploy-aws.yml

- name: Deploy AWS test environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate AWS configuration
      ansible.builtin.assert:
        that:
          - aws_region != ""
          - aws_key_name != ""
          - aws_ami_id != ""
        fail_msg: "Remplir aws_region, aws_key_name et aws_ami_id dans group_vars/all/aws.yml"

    # ── VPC & Subnet ───────────────────────────────────────────────

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ aws_prefix }}-vpc"
        cidr_block: "10.0.0.0/16"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-vpc"
          Environment: "test"
        state: present
      register: vpc

    - name: Set VPC ID
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc.vpc.id }}"

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "10.0.1.0/24"
        az: "{{ aws_region }}a"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        map_public: true
        tags:
          Name: "{{ aws_prefix }}-subnet"
          Environment: "test"
        state: present
      register: subnet

    - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-igw"
        state: present
      register: igw

    - name: Create route table with internet route
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        subnets:
          - "{{ subnet.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ aws_prefix }}-rt"
        state: present

    # ── Security Groups ──────────────────────────────────────────────

    - name: Create Bastion security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_prefix }}-bastion-sg"
        description: "Bastion - SSH from internet"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "0.0.0.0/0"
            rule_desc: "SSH from internet"
        tags:
          Name: "{{ aws_prefix }}-bastion-sg"
          Tier: "bastion"
          Environment: "test"
        state: present
      register: bastion_sg

    - name: Create Load Balancer security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_prefix }}-lb-sg"
        description: "Load Balancer - accepts HTTP/HTTPS from internet, SSH from bastion"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        rules:
          - proto: tcp
            ports: [80]
            cidr_ip: "0.0.0.0/0"
            rule_desc: "HTTP from internet"
          - proto: tcp
            ports: [443]
            cidr_ip: "0.0.0.0/0"
            rule_desc: "HTTPS from internet"
          - proto: tcp
            ports: [22]
            group_id: "{{ bastion_sg.group_id }}"
            rule_desc: "SSH from bastion"
        tags:
          Name: "{{ aws_prefix }}-lb-sg"
          Tier: "loadbalancer"
          Environment: "test"
        state: present
      register: lb_sg

    - name: Create Web security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_prefix }}-web-sg"
        description: "Web servers - accepts traffic from LB, SSH from bastion"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        rules:
          - proto: tcp
            ports: [8080]
            group_id: "{{ lb_sg.group_id }}"
            rule_desc: "HTTP from load balancer"
          - proto: tcp
            ports: [8443]
            group_id: "{{ lb_sg.group_id }}"
            rule_desc: "HTTPS from load balancer"
          - proto: tcp
            ports: [22]
            group_id: "{{ bastion_sg.group_id }}"
            rule_desc: "SSH from bastion"
        tags:
          Name: "{{ aws_prefix }}-web-sg"
          Tier: "web"
          Environment: "test"
        state: present
      register: web_sg

    - name: Create Database security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_prefix }}-db-sg"
        description: "Database - accepts traffic from web tier, SSH from bastion"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        rules:
          - proto: tcp
            ports: [3306]
            group_id: "{{ web_sg.group_id }}"
            rule_desc: "MySQL from web tier"
          - proto: tcp
            ports: [5432]
            group_id: "{{ web_sg.group_id }}"
            rule_desc: "PostgreSQL from web tier"
          - proto: tcp
            ports: [6379]
            group_id: "{{ web_sg.group_id }}"
            rule_desc: "Redis from web tier"
          - proto: tcp
            ports: [22]
            group_id: "{{ bastion_sg.group_id }}"
            rule_desc: "SSH from bastion"
        tags:
          Name: "{{ aws_prefix }}-db-sg"
          Tier: "database"
          Environment: "test"
        state: present
      register: db_sg

    # ── Instances ────────────────────────────────────────────────────

    - name: Launch Bastion instance
      amazon.aws.ec2_instance:
        name: "{{ aws_prefix }}-bastion"
        instance_type: "{{ aws_instance_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ aws_key_name }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ bastion_sg.group_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-bastion"
          Role: "bastion"
          Environment: "test"
        state: present
        wait: true
        wait_timeout: 300
      register: bastion_instance

    - name: Launch Load Balancer instance
      amazon.aws.ec2_instance:
        name: "{{ aws_prefix }}-lb"
        instance_type: "{{ aws_instance_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ aws_key_name }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ lb_sg.group_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-lb"
          Role: "loadbalancer"
          Environment: "test"
        state: present
        wait: true
        wait_timeout: 300
      register: lb_instance

    - name: Launch Web Server 1
      amazon.aws.ec2_instance:
        name: "{{ aws_prefix }}-web-1"
        instance_type: "{{ aws_instance_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ aws_key_name }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ web_sg.group_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-web-1"
          Role: "webserver"
          Environment: "test"
        state: present
        wait: true
        wait_timeout: 300
      register: web1_instance

    - name: Launch Web Server 2
      amazon.aws.ec2_instance:
        name: "{{ aws_prefix }}-web-2"
        instance_type: "{{ aws_instance_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ aws_key_name }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ web_sg.group_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-web-2"
          Role: "webserver"
          Environment: "test"
        state: present
        wait: true
        wait_timeout: 300
      register: web2_instance

    - name: Launch Database instance
      amazon.aws.ec2_instance:
        name: "{{ aws_prefix }}-db"
        instance_type: "{{ aws_instance_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ aws_key_name }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_groups:
          - "{{ db_sg.group_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        tags:
          Name: "{{ aws_prefix }}-db"
          Role: "database"
          Environment: "test"
        state: present
        wait: true
        wait_timeout: 300
      register: db_instance

    # ── Summary ──────────────────────────────────────────────────────

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════
          AWS Test Environment Deployed
          ══════════════════════════════════════════

          Security Groups:
            {{ aws_prefix }}-bastion-sg ({{ bastion_sg.group_id }}) - SSH from internet
            {{ aws_prefix }}-lb-sg      ({{ lb_sg.group_id }})      - HTTP/HTTPS from internet, SSH from bastion
            {{ aws_prefix }}-web-sg     ({{ web_sg.group_id }})     - from LB, SSH from bastion
            {{ aws_prefix }}-db-sg      ({{ db_sg.group_id }})      - from web, SSH from bastion

          Instances:
            {{ aws_prefix }}-bastion ({{ bastion_instance.instances[0].instance_id }})
            {{ aws_prefix }}-lb      ({{ lb_instance.instances[0].instance_id }})
            {{ aws_prefix }}-web-1   ({{ web1_instance.instances[0].instance_id }})
            {{ aws_prefix }}-web-2   ({{ web2_instance.instances[0].instance_id }})
            {{ aws_prefix }}-db      ({{ db_instance.instances[0].instance_id }})

          VPC: {{ vpc_id }} | Region: {{ aws_region }}

          Next:
            ansible-playbook playbooks/test-aws.yml
